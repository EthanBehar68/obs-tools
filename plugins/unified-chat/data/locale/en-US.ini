Settings.YouTube.Connect.OnStream="When OBS starts streaming"
Settings.YouTube.Connect.Always="Always (checks every 2 minutes while offline)"
Settings.YouTube.ConnectHint="'When OBS starts streaming' uses no YouTube quota while you're offline and connects when you press Start Streaming. Choose 'Always' if YouTube goes live some other way, such as from another app or a multistream output with an auto-start stream key."
Settings.YouTube.Method="Chat delivery"
Settings.YouTube.Method.Stream="Streaming (fastest)"
Settings.YouTube.Method.Poll="Polling"
Settings.YouTube.MethodHint="Streaming shows messages about 2 seconds after they're posted and uses about 1,700 quota units an hour while live. Polling uses 5 units per poll (about 2,250 an hour at 8 seconds) and adds up to one poll interval of delay. Streaming switches to polling by itself if it stops working."
Settings.YouTube.Poll="Minimum poll interval"
Settings.YouTube.PollHint="Used for polling, and when streaming falls back to polling. Lower values show messages faster but use more of your daily YouTube API quota."
Settings.ViewerCheck="Check viewer counts every"
Settings.ViewerCheckHint="How often the status buttons' viewer counts update while you're live. Twitch's check is free; each YouTube check uses 1 quota unit (12 an hour at 5 minutes, 60 at 1 minute). YouTube itself updates the count about once a minute."
Settings.MinutesSuffix=" min"
