Settings.Twitch.MethodHint="EventSub is the connection Twitch recommends. It needs a sign-in that allows it; until then, and whenever you're signed out, chat uses IRC. IRC is kept in case EventSub ever misbehaves."
Settings.YouTube.Video="Video (optional)"
Settings.YouTube.VideoHint="Leave empty to use your current live broadcast"
