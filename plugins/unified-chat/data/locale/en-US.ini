Legend.Title="Legend"
Legend.Twitch="From Twitch"
Legend.YouTube="From YouTube (a line with both icons went to both platforms)"
Legend.Self="Your own message"
Legend.Badges="Small icons before a Twitch name show the person's role: broadcaster, moderator, VIP, subscriber or founder (needs a Twitch sign-in)"
Legend.NoAudio="Twitch's Watching without audio badge (a muted speaker): the viewer can't hear the stream. Viewers choose it themselves in Twitch's chat settings"
Legend.NoVideo="Twitch's Listening only badge (a crossed-out eye): the viewer can't see the stream"
Legend.Emotes="Emotes appear as pictures: Twitch's own and the channel's BTTV, FFZ and 7TV emotes (animated ones show their first frame)"
Legend.Name="Click a name to mention that person (on Twitch it also replies to their message); type @ and a letter for suggestions"
Legend.Reply="A Twitch reply, showing who it answers"
Legend.Mention="Highlighted: the message mentions you"
Legend.Moderate="Right-click someone's line to delete it, time them out, ban or unban (as broadcaster or moderator; each action asks first)"
Legend.Deleted="A moderator deleted this message (Twitch only: YouTube no longer reports single deletions)"
Legend.TimedOut="The author was timed out; the duration is shown (Twitch)"
Legend.Removed="The author was timed out or banned; Twitch only says which when the dock is in your own channel"
Legend.Banned="The author was banned (Twitch or YouTube)"
Legend.Cleared="A moderator cleared the Twitch chat"
Legend.Notice="Grey italic lines are notices: connection changes, timeouts, bans, errors"
